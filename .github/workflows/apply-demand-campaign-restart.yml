name: Apply Smart Offer Restart Production Migration

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-demand-campaign-restart.yml"
      - "supabase/migrations/20260826150000_demand_campaign_restart.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-database-production
  cancel-in-progress: false

jobs:
  migrate:
    name: Preflight, apply once, and verify Smart Offer restart
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zcuufcpkgidmaanxjufo
      MIGRATION_FILE: supabase/migrations/20260826150000_demand_campaign_restart.sql
      MIGRATION_SHA256: ed73144436b7a6297c05d7db65ff1df115d98102247bac8b462d0d16c37cd47b
      PREFLIGHT_SQL: |
        with migration_history as (
          select version, name, statements
          from supabase_migrations.schema_migrations
          where version = '20260826150000'
        ),
        restart_function as (
          select to_regprocedure(
            'public.create_demand_campaign_from_recommendation(text,text)'
          ) as oid
        )
        select jsonb_build_object(
          'base_ready',
            to_regclass('public.demand_campaigns') is not null
            and to_regclass('public.demand_campaign_redemptions') is not null
            and to_regprocedure(
              'public.get_demand_growth_intelligence(date,date,text)'
            ) is not null
            and to_regprocedure(
              'public.create_demand_campaign_from_recommendation(text,text)'
            ) is not null
            and to_regprocedure(
              'public.release_expired_demand_campaign_reservations()'
            ) is not null,
          'schema_present',
            not exists (
              select 1
              from pg_constraint
              where conrelid = 'public.demand_campaigns'::regclass
                and conname = 'demand_campaigns_source_recommendation_id_key'
            )
            and exists (
              select 1
              from pg_class index_class
              join pg_index index_row on index_row.indexrelid = index_class.oid
              where index_class.oid =
                to_regclass('public.demand_campaigns_source_recommendation_idx')
                and not index_row.indisunique
            )
            and coalesce((
              select position('remaining_redemptions' in pg_get_functiondef(oid)) > 0
                and position('is_restart' in pg_get_functiondef(oid)) > 0
              from restart_function
            ), false),
          'history_exists', exists (select 1 from migration_history),
          'history_name', coalesce((select name from migration_history limit 1), ''),
          'history_marker', coalesce((select statements[1] from migration_history limit 1), '')
        ) as preflight;
      HISTORY_SQL: |
        begin;
        set local lock_timeout = '5s';
        set local statement_timeout = '30s';

        insert into supabase_migrations.schema_migrations (version, name, statements)
        values (
          '20260826150000',
          'demand_campaign_restart',
          array['sha256:ed73144436b7a6297c05d7db65ff1df115d98102247bac8b462d0d16c37cd47b']::text[]
        )
        on conflict (version) do nothing;

        commit;
      VERIFY_SQL: |
        do $verify$
        declare
          restart_function regprocedure := to_regprocedure(
            'public.create_demand_campaign_from_recommendation(text,text)'
          );
          restart_definition text;
        begin
          if restart_function is null then
            raise exception 'Smart Offer creation function is missing';
          end if;

          select pg_get_functiondef(restart_function)
            into restart_definition;

          if position('is_restart' in restart_definition) = 0
             or position('remaining_redemptions' in restart_definition) = 0
             or position('release_expired_demand_campaign_reservations' in restart_definition) = 0 then
            raise exception 'Smart Offer restart and safety-cap logic is incomplete';
          end if;

          if not coalesce((
            select prosecdef
              and coalesce(proconfig, '{}'::text[]) @>
                array['search_path=public, pg_temp']::text[]
            from pg_proc
            where oid = restart_function
          ), false) then
            raise exception 'Smart Offer creation function lost its security attributes';
          end if;

          if not has_function_privilege('authenticated', restart_function, 'execute')
             or has_function_privilege('anon', restart_function, 'execute') then
            raise exception 'Smart Offer creation grants are incorrect';
          end if;

          if exists (
            select 1
            from pg_constraint
            where conrelid = 'public.demand_campaigns'::regclass
              and conname = 'demand_campaigns_source_recommendation_id_key'
          ) then
            raise exception 'Ended recommendations are still globally unique';
          end if;

          if not exists (
            select 1
            from pg_class index_class
            join pg_index index_row on index_row.indexrelid = index_class.oid
            where index_class.oid =
              to_regclass('public.demand_campaigns_source_recommendation_idx')
              and not index_row.indisunique
          ) then
            raise exception 'Smart Offer recommendation lookup index is missing';
          end if;

          if not exists (
            select 1
            from pg_class index_class
            join pg_index index_row on index_row.indexrelid = index_class.oid
            where index_class.oid =
              to_regclass('public.demand_campaigns_one_active_uidx')
              and index_row.indisunique
              and pg_get_expr(index_row.indpred, index_row.indrelid)
                like '%status%active%'
          ) then
            raise exception 'The one-active-Smart-Offer concurrency guard is missing';
          end if;

          if has_table_privilege('anon', 'public.demand_campaigns', 'select')
             or has_table_privilege(
               'anon',
               'public.demand_campaign_redemptions',
               'select'
             ) then
            raise exception 'Smart Offer tables expose anonymous reads';
          end if;

          if not exists (
            select 1
            from supabase_migrations.schema_migrations
            where version = '20260826150000'
              and name = 'demand_campaign_restart'
              and statements = array[
                'sha256:ed73144436b7a6297c05d7db65ff1df115d98102247bac8b462d0d16c37cd47b'
              ]::text[]
          ) then
            raise exception 'Smart Offer restart migration history is missing or non-canonical';
          end if;
        end
        $verify$;
    steps:
      - uses: actions/checkout@v5

      - name: Read-only production preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          test -s "$MIGRATION_FILE"
          printf '%s  %s\n' "$MIGRATION_SHA256" "$MIGRATION_FILE" |
            sha256sum --check --strict -

          payload_file="$RUNNER_TEMP/smart-offer-restart-preflight.json"
          response_file="$RUNNER_TEMP/smart-offer-restart-preflight-response.json"
          jq -n --arg query "$PREFLIGHT_SQL" '{query: $query}' > "$payload_file"

          status_code="$(curl --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_file")"

          if [[ ! "$status_code" =~ ^2 ]]; then
            echo "::error::Smart Offer restart preflight failed with HTTP $status_code."
            jq -c '{code, message, error}' "$response_file" 2>/dev/null || true
            exit 1
          fi

          preflight="$(jq -c '
            if type == "array" then .[0].preflight
            elif (.result? | type) == "array" then .result[0].preflight
            else .preflight end
          ' "$response_file")"
          if [[ -z "$preflight" || "$preflight" == "null" ]]; then
            echo "::error::Smart Offer restart preflight returned no result."
            exit 1
          fi
          if [[ "$(jq -r '.base_ready' <<<"$preflight")" != "true" ]]; then
            echo "::error::Demand Growth base schema is incomplete; migration was not attempted."
            exit 1
          fi

          if [[ "$(jq -r '.history_exists' <<<"$preflight")" == "true" ]]; then
            marker="$(jq -r '.history_marker' <<<"$preflight")"
            name="$(jq -r '.history_name' <<<"$preflight")"
            if [[ "$marker" != "sha256:$MIGRATION_SHA256" || \
                  "$name" != "demand_campaign_restart" ]]; then
              echo "::error::Migration 20260826150000 has non-canonical history."
              exit 1
            fi
            echo "skip_apply=true" >> "$GITHUB_OUTPUT"
            echo "Canonical Smart Offer restart migration is already recorded."
          else
            if [[ "$(jq -r '.schema_present' <<<"$preflight")" == "true" ]]; then
              echo "::error::Smart Offer restart schema exists without canonical history."
              exit 1
            fi
            echo "skip_apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply Smart Offer restart migration exactly once
        if: steps.preflight.outputs.skip_apply != 'true'
        shell: bash
        run: |
          set -euo pipefail
          payload_file="$RUNNER_TEMP/smart-offer-restart-migration.json"
          response_file="$RUNNER_TEMP/smart-offer-restart-migration-response.json"

          jq -Rs --arg history "$HISTORY_SQL" \
            '{query: (. + "\n" + $history)}' \
            "$MIGRATION_FILE" > "$payload_file"

          # Deliberately one mutation POST with no automatic retry. A later
          # preflight refuses partial or unrecorded state.
          status_code="$(curl --silent --show-error \
            --connect-timeout 15 --max-time 120 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_file")"

          if [[ ! "$status_code" =~ ^2 ]]; then
            echo "::error::Smart Offer restart migration failed with HTTP $status_code."
            jq -c '{code, message, error}' "$response_file" 2>/dev/null || true
            exit 1
          fi

      - name: Verify production database state
        shell: bash
        run: |
          set -euo pipefail
          payload_file="$RUNNER_TEMP/smart-offer-restart-verification.json"
          response_file="$RUNNER_TEMP/smart-offer-restart-verification-response.json"
          jq -n --arg query "$VERIFY_SQL" '{query: $query}' > "$payload_file"

          status_code="$(curl --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 90 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_file")"

          if [[ ! "$status_code" =~ ^2 ]]; then
            echo "::error::Smart Offer restart verification failed with HTTP $status_code."
            jq -c '{code, message, error}' "$response_file" 2>/dev/null || true
            exit 1
          fi

          echo "Smart Offer restart production migration verified."

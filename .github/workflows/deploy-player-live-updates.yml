name: Deploy Player Live Request Efficiency

on:
  push:
    branches: [main]
    paths:
      - 'supabase/migrations/20261018003000_player_live_invalidation.sql'
      - 'tools/manage-player-live-updates.mjs'
      - 'tools/player-live-probe.mjs'
      - '.github/workflows/deploy-player-live-updates.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Deploy the migration, or probe an already applied migration without replaying it.'
        type: choice
        options: [deploy, probe-enable, verify]
        default: deploy
        required: true

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false
  queue: max

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zcuufcpkgidmaanxjufo
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run check
      - run: npm test
      - name: Rehearse live board migration with rollback
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: node tools/manage-player-live-updates.mjs rehearse
      - name: Apply live board migration
        if: github.event_name == 'push' || inputs.action == 'deploy'
        run: node tools/manage-player-live-updates.mjs apply
      - name: Test anonymous database broadcast before enabling live updates
        if: github.event_name == 'push' || inputs.action != 'verify'
        run: node tools/manage-player-live-updates.mjs probe-enable
      - name: Verify live board permissions and triggers
        run: node tools/manage-player-live-updates.mjs verify

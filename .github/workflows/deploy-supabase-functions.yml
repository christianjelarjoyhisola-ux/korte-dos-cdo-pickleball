name: Deploy Supabase Edge Functions

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
  workflow_dispatch:
    inputs:
      function:
        description: Edge Function to deploy
        required: true
        default: verify-gcash-receipt
        type: choice
        options:
          - verify-gcash-receipt
          - manage-payment-review-notification
          - process-payment-review-notifications
          - review-payment-receipt
          - manual-payment-restoration
          - all

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy changed functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zcuufcpkgidmaanxjufo
      MANUAL_RESTORE_MIGRATION: supabase/migrations/20260813043000_restore_cancelled_manual_payment.sql
      MANUAL_RESTORE_SHA256: bd0e020c763699451de90244a08fa86c9bd4de0c6a62acf1106d732d1f63c42f
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Select functions to deploy
        id: functions
        shell: bash
        run: |
          set -euo pipefail

          all_functions=(
            create-payment-session
            payment-webhook
            verify-gcash-receipt
            host-application
            manage-account
            manage-payment-review-notification
            process-payment-review-notifications
            review-payment-receipt
            send-confirmation-email
            process-host-balance-deadlines
            send-reschedule-email
            send-telegram-notification
            integration-status
          )

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            if [[ "${{ inputs.function }}" == "manual-payment-restoration" ]]; then
              selected=(review-payment-receipt)
            elif [[ "${{ inputs.function }}" == "all" ]]; then
              selected=("${all_functions[@]}")
            else
              selected=("${{ inputs.function }}")
            fi
          else
            mapfile -t changed_files < <(
              git diff --name-only "${{ github.event.before }}" "${{ github.sha }}" -- supabase/functions
            )

            shared_changed=false
            for changed_file in "${changed_files[@]}"; do
              if [[ "$changed_file" == supabase/functions/_shared/* ]]; then
                shared_changed=true
                break
              fi
            done

            if [[ "$shared_changed" == "true" ]]; then
              # The payment-review migration workflow owns these four
              # schema-dependent functions and deploys them only after verifying
              # the production schema. This workflow may deploy the others.
              selected=(
                create-payment-session
                payment-webhook
                host-application
                manage-account
                send-confirmation-email
                process-host-balance-deadlines
                send-reschedule-email
                send-telegram-notification
                integration-status
              )
            else
              mapfile -t selected < <(
                printf '%s\n' "${changed_files[@]}" |
                  awk -F/ '
                    /^supabase\/functions\/[^/]+\// &&
                    $3 != "_shared" &&
                    $3 != "verify-gcash-receipt" &&
                    $3 != "host-booking-balance-payment" &&
                    $3 != "manage-payment-review-notification" &&
                    $3 != "process-payment-review-notifications" &&
                    $3 != "review-payment-receipt" {
                      print $3
                    }
                  ' |
                  sort -u
              )
            fi
          fi

          if [[ ${#selected[@]} -eq 0 ]]; then
            echo "No deployable Edge Function changed."
            echo "names=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          names="${selected[*]}"
          echo "Deploying: $names"
          echo "names=$names" >> "$GITHUB_OUTPUT"

      - name: Apply manual payment restoration migration
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.function == 'manual-payment-restoration' }}
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          test -s "$MANUAL_RESTORE_MIGRATION"
          printf '%s  %s\n' "$MANUAL_RESTORE_SHA256" "$MANUAL_RESTORE_MIGRATION" |
            sha256sum --check --strict -

          history_sql="
            create schema if not exists supabase_migrations;
            create table if not exists supabase_migrations.schema_migrations (
              version text not null primary key
            );
            alter table supabase_migrations.schema_migrations
              add column if not exists statements text[];
            alter table supabase_migrations.schema_migrations
              add column if not exists name text;
            insert into supabase_migrations.schema_migrations (version, name, statements)
            values (
              '20260813043000',
              'restore_cancelled_manual_payment',
              array['sha256:$MANUAL_RESTORE_SHA256']::text[]
            )
            on conflict (version) do update
            set name = excluded.name,
                statements = excluded.statements;
          "
          payload_file="$RUNNER_TEMP/manual-payment-restoration.json"
          response_file="$RUNNER_TEMP/manual-payment-restoration-response.json"
          jq -Rs --arg history "$history_sql" \
            '{query: ("begin;\n" + . + "\n" + $history + "\ncommit;")}' \
            "$MANUAL_RESTORE_MIGRATION" > "$payload_file"

          status_code="$(curl --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_file")"
          if [[ ! "$status_code" =~ ^2 ]]; then
            echo "::error::Manual payment restoration migration failed with HTTP $status_code."
            jq -c '{code, message, error}' "$response_file" 2>/dev/null || true
            exit 1
          fi

      - name: Deploy Edge Functions
        if: steps.functions.outputs.names != ''
        shell: bash
        run: |
          set -euo pipefail
          for function_name in ${{ steps.functions.outputs.names }}; do
            supabase functions deploy "$function_name" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt
          done

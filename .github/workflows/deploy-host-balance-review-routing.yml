name: Deploy Host Balance Review Routing

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-host-balance-review-routing.yml"
      - "supabase/migrations/20260815123000_host_balance_reviewable_receipts.sql"
      - "supabase/functions/verify-gcash-receipt/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply review routing and deploy receipt verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zcuufcpkgidmaanxjufo
      MIGRATION_FILE: supabase/migrations/20260815123000_host_balance_reviewable_receipts.sql
      MIGRATION_SHA256: 9b6a215d44a5b08a193604a74f5340346264e36909f31faf15fc6b41dedd63d5

    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Apply checksum-locked review-routing migration
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          test -s "$MIGRATION_FILE"
          printf '%s  %s\n' "$MIGRATION_SHA256" "$MIGRATION_FILE" |
            sha256sum --check --strict -

          history_sql="
            create schema if not exists supabase_migrations;
            create table if not exists supabase_migrations.schema_migrations (
              version text not null primary key
            );
            alter table supabase_migrations.schema_migrations
              add column if not exists statements text[];
            alter table supabase_migrations.schema_migrations
              add column if not exists name text;
            insert into supabase_migrations.schema_migrations (version, name, statements)
            values (
              '20260815123000',
              'host_balance_reviewable_receipts',
              array['sha256:$MIGRATION_SHA256']::text[]
            )
            on conflict (version) do update
            set name = excluded.name,
                statements = excluded.statements;
          "

          payload_file="$RUNNER_TEMP/host-balance-review-routing.json"
          response_file="$RUNNER_TEMP/host-balance-review-routing-response.json"
          jq -Rs --arg history "$history_sql" \
            '{query: ("begin;\n" + . + "\n" + $history + "\ncommit;")}' \
            "$MIGRATION_FILE" > "$payload_file"

          status_code="$(curl --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_file")"
          if [[ ! "$status_code" =~ ^2 ]]; then
            echo "::error::Host balance review migration failed with HTTP $status_code."
            jq -c '{code, message, error}' "$response_file" 2>/dev/null || true
            exit 1
          fi

      - name: Verify production review-routing contract
        shell: bash
        run: |
          set -euo pipefail
          verify_sql=$(cat <<'SQL'
          do $verify$
          begin
            if to_regprocedure(
              'public.route_host_balance_receipt_for_owner_review()'
            ) is null then
              raise exception 'host balance receipt routing function is missing';
            end if;
            if not exists (
              select 1
              from pg_trigger
              where tgname = 'route_host_balance_receipt_for_owner_review'
                and tgrelid = 'public.receipt_verifications'::regclass
                and not tgisinternal
            ) then
              raise exception 'host balance receipt routing trigger is missing';
            end if;
            if not exists (
              select 1
              from supabase_migrations.schema_migrations
              where version = '20260815123000'
                and name = 'host_balance_reviewable_receipts'
            ) then
              raise exception 'host balance review migration history is missing';
            end if;
          end;
          $verify$;
          SQL
          )
          payload_file="$RUNNER_TEMP/host-balance-review-routing-verify.json"
          response_file="$RUNNER_TEMP/host-balance-review-routing-verify-response.json"
          jq -n --arg query "$verify_sql" '{query: $query}' > "$payload_file"
          status_code="$(curl --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_file")"
          if [[ ! "$status_code" =~ ^2 ]]; then
            echo "::error::Host balance review verification failed with HTTP $status_code."
            jq -c '{code, message, error}' "$response_file" 2>/dev/null || true
            exit 1
          fi

      - name: Deploy exact-amount receipt verification
        shell: bash
        run: |
          set -euo pipefail
          supabase functions deploy verify-gcash-receipt \
            --project-ref "$SUPABASE_PROJECT_REF" \
            --no-verify-jwt

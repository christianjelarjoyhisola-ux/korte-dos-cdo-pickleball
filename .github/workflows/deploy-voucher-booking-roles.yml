name: Deploy Voucher Booking Roles

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/deploy-voucher-booking-roles.yml"
      - "supabase/migrations/20260814154500_vouchers_for_all_booking_roles.sql"
      - "supabase/functions/_shared/booking-payment.ts"
      - "supabase/functions/create-payment-session/**"
      - "supabase/functions/payment-webhook/**"
      - "supabase/functions/verify-gcash-receipt/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Apply voucher migration and deploy payment functions
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zcuufcpkgidmaanxjufo
      MIGRATION_FILE: supabase/migrations/20260814154500_vouchers_for_all_booking_roles.sql
      MIGRATION_SHA256: f10c21876e70d93c79c600f63f40145825da518924c8581e0993500ade845518
    steps:
      - uses: actions/checkout@v5

      - uses: supabase/setup-cli@v1
        with:
          version: 2.109.1

      - name: Apply checksum-locked voucher migration
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          test -s "$MIGRATION_FILE"
          printf '%s  %s\n' "$MIGRATION_SHA256" "$MIGRATION_FILE" |
            sha256sum --check --strict -

          history_sql="
            create schema if not exists supabase_migrations;
            create table if not exists supabase_migrations.schema_migrations (
              version text not null primary key
            );
            alter table supabase_migrations.schema_migrations
              add column if not exists statements text[];
            alter table supabase_migrations.schema_migrations
              add column if not exists name text;
            insert into supabase_migrations.schema_migrations (version, name, statements)
            values (
              '20260814154500',
              'vouchers_for_all_booking_roles',
              array['sha256:$MIGRATION_SHA256']::text[]
            )
            on conflict (version) do update
            set name = excluded.name,
                statements = excluded.statements;
          "

          payload_file="$RUNNER_TEMP/voucher-booking-roles.json"
          response_file="$RUNNER_TEMP/voucher-booking-roles-response.json"
          jq -Rs --arg history "$history_sql" \
            '{query: ("begin;\n" + . + "\n" + $history + "\ncommit;")}' \
            "$MIGRATION_FILE" > "$payload_file"

          status_code="$(curl --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_file")"
          if [[ ! "$status_code" =~ ^2 ]]; then
            echo "::error::Voucher migration failed with HTTP $status_code."
            jq -c '{code, message, error}' "$response_file" 2>/dev/null || true
            exit 1
          fi

      - name: Verify production voucher contract
        shell: bash
        run: |
          set -euo pipefail
          verify_sql=$(cat <<'SQL'
          do $verify$
          declare
            apply_fn regprocedure := to_regprocedure('public.apply_booking_voucher(text,text[])');
            remove_fn regprocedure := to_regprocedure('public.remove_booking_voucher(text[])');
            finalize_fn regprocedure := to_regprocedure('public.finalize_booking_voucher(text[],text)');
            apply_definition text;
            remove_definition text;
            finalize_definition text;
          begin
            if apply_fn is null or remove_fn is null or finalize_fn is null then
              raise exception 'one or more voucher RPCs are missing';
            end if;

            apply_definition := pg_get_functiondef(apply_fn);
            remove_definition := pg_get_functiondef(remove_fn);
            finalize_definition := pg_get_functiondef(finalize_fn);

            if position('account_role = ''host''' in apply_definition) = 0
               or position('host_user_id = auth.uid()' in apply_definition) = 0
               or position('booking_fee_amount_snapshot' in apply_definition) = 0 then
              raise exception 'voucher apply RPC is missing role ownership or fee protection';
            end if;
            if position('host_user_id = auth.uid()' in remove_definition) = 0
               or position('host_user_id = auth.uid()' in finalize_definition) = 0 then
              raise exception 'voucher lifecycle RPC ownership checks are missing';
            end if;

            if not has_function_privilege('anon', apply_fn, 'execute')
               or not has_function_privilege('authenticated', apply_fn, 'execute')
               or not has_function_privilege('anon', remove_fn, 'execute')
               or not has_function_privilege('authenticated', remove_fn, 'execute')
               or not has_function_privilege('anon', finalize_fn, 'execute')
               or not has_function_privilege('authenticated', finalize_fn, 'execute') then
              raise exception 'voucher RPC execution grants are incomplete';
            end if;

            if not exists (
              select 1
                from supabase_migrations.schema_migrations
               where version = '20260814154500'
                 and name = 'vouchers_for_all_booking_roles'
            ) then
              raise exception 'voucher migration history entry is missing';
            end if;
          end;
          $verify$;
          SQL
          )

          payload_file="$RUNNER_TEMP/voucher-booking-roles-verify.json"
          response_file="$RUNNER_TEMP/voucher-booking-roles-verify-response.json"
          jq -n --arg query "$verify_sql" '{query: $query}' > "$payload_file"
          status_code="$(curl --silent --show-error \
            --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 \
            --output "$response_file" --write-out '%{http_code}' \
            --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" \
            --data-binary "@$payload_file")"
          if [[ ! "$status_code" =~ ^2 ]]; then
            echo "::error::Voucher production verification failed with HTTP $status_code."
            jq -c '{code, message, error}' "$response_file" 2>/dev/null || true
            exit 1
          fi

      - name: Deploy voucher-aware payment functions
        shell: bash
        run: |
          set -euo pipefail
          for function_name in create-payment-session payment-webhook verify-gcash-receipt; do
            supabase functions deploy "$function_name" \
              --project-ref "$SUPABASE_PROJECT_REF" \
              --no-verify-jwt
          done

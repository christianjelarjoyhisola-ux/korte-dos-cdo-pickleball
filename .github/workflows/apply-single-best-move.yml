name: Apply Single Best Move

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-single-best-move.yml"
      - "supabase/migrations/20260826210000_single_best_move.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify single Best Move
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zcuufcpkgidmaanxjufo
      MIGRATION_FILE: supabase/migrations/20260826210000_single_best_move.sql
      MIGRATION_SHA256: 0c2d83fdc58775994a2ab29a46fa34c96d25e16ee12ae68d507a5d51cc8eeeda
      PREFLIGHT_SQL: |
        with history as (
          select statements from supabase_migrations.schema_migrations
          where version = '20260826210000'
        )
        select jsonb_build_object(
          'base_ready',
            to_regprocedure('public.get_profit_learning_v2_intelligence(date,date,text)') is not null
            and to_regprocedure('public.create_profit_learning_experiment_from_recommendation(text,text)') is not null,
          'patch_present',
            to_regprocedure('public.advance_profit_learning_best_move()') is not null,
          'history_exists', exists (select 1 from history),
          'history_marker', coalesce((select statements[1] from history limit 1), '')
        ) as preflight;
      HISTORY_SQL: |
        create schema if not exists supabase_migrations;
        create table if not exists supabase_migrations.schema_migrations (
          version text not null primary key
        );
        alter table supabase_migrations.schema_migrations add column if not exists statements text[];
        alter table supabase_migrations.schema_migrations add column if not exists name text;
        insert into supabase_migrations.schema_migrations (version, name, statements)
        values (
          '20260826210000', 'single_best_move',
          array['sha256:0c2d83fdc58775994a2ab29a46fa34c96d25e16ee12ae68d507a5d51cc8eeeda']::text[]
        )
        on conflict (version) do update
        set name = excluded.name, statements = excluded.statements;
      VERIFY_SQL: |
        do $verify$
        declare
          intelligence regprocedure := to_regprocedure('public.get_profit_learning_v2_intelligence(date,date,text)');
          creator regprocedure := to_regprocedure('public.create_profit_learning_experiment_from_recommendation(text,text)');
          advance regprocedure := to_regprocedure('public.advance_profit_learning_best_move()');
        begin
          if intelligence is null or creator is null or advance is null then
            raise exception 'Single Best Move functions are missing';
          end if;
          if pg_get_functiondef(intelligence) not ilike '%''target_occurrences'', 1%'
             or pg_get_functiondef(intelligence) not ilike '%''horizon_days'', 28%'
             or pg_get_functiondef(creator) not ilike '%(local_today + 28)%'
             or pg_get_functiondef(creator) not ilike '%limit 1%'
             or pg_get_functiondef(creator) not ilike '%''treatment''%'
             or pg_get_functiondef(creator) ilike '%''control''%' then
            raise exception 'Single Best Move contract is incomplete';
          end if;
          if exists (
            select 1 from public.profit_learning_experiments
            where status = 'active' and target_pairs <> 1
          ) then
            raise exception 'A legacy long-running experiment is still active';
          end if;
          if has_function_privilege('anon', creator, 'execute')
             or has_function_privilege('anon', advance, 'execute')
             or not has_function_privilege('authenticated', creator, 'execute')
             or not has_function_privilege('authenticated', advance, 'execute') then
            raise exception 'Single Best Move RPC grants are unsafe';
          end if;
          if not exists (
            select 1 from supabase_migrations.schema_migrations
            where version = '20260826210000'
              and name = 'single_best_move'
              and statements = array['sha256:0c2d83fdc58775994a2ab29a46fa34c96d25e16ee12ae68d507a5d51cc8eeeda']::text[]
          ) then
            raise exception 'Single Best Move migration history is missing';
          end if;
        end
        $verify$;
    steps:
      - uses: actions/checkout@v5

      - name: Read-only production preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          printf '%s  %s\n' "$MIGRATION_SHA256" "$MIGRATION_FILE" | sha256sum --check --strict -
          payload="$RUNNER_TEMP/single-best-move-preflight.json"
          response="$RUNNER_TEMP/single-best-move-preflight-response.json"
          jq -n --arg query "$PREFLIGHT_SQL" '{query:$query}' > "$payload"
          status="$(curl --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 --output "$response" --write-out '%{http_code}' \
            --request POST --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }
          result="$(jq -c 'if type=="array" then .[0].preflight elif (.result?|type)=="array" then .result[0].preflight else .preflight end' "$response")"
          [[ "$(jq -r '.base_ready' <<<"$result")" == "true" ]] || { echo "::error::Profit Learning prerequisites are missing."; exit 1; }
          if [[ "$(jq -r '.history_exists' <<<"$result")" == "true" ]]; then
            [[ "$(jq -r '.history_marker' <<<"$result")" == "sha256:$MIGRATION_SHA256" ]] || { echo "::error::Migration checksum mismatch."; exit 1; }
            echo "skip_apply=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$(jq -r '.patch_present' <<<"$result")" == "false" ]] || { echo "::error::Single Best Move exists without canonical history."; exit 1; }
            echo "skip_apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply checksum-locked migration exactly once
        if: steps.preflight.outputs.skip_apply != 'true'
        shell: bash
        run: |
          set -euo pipefail
          stripped="$RUNNER_TEMP/single-best-move.sql"
          sed -e '1{/^[[:space:]]*begin;[[:space:]]*$/Id;}' \
              -e '${/^[[:space:]]*commit;[[:space:]]*$/Id;}' "$MIGRATION_FILE" > "$stripped"
          payload="$RUNNER_TEMP/single-best-move.json"
          response="$RUNNER_TEMP/single-best-move-response.json"
          jq -Rs --arg history "$HISTORY_SQL" \
            '{query:("begin;\n" + . + "\n" + $history + "\ncommit;")}' "$stripped" > "$payload"
          status="$(curl --silent --show-error --connect-timeout 15 --max-time 150 \
            --output "$response" --write-out '%{http_code}' --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }

      - name: Verify production database state
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/single-best-move-verify.json"
          response="$RUNNER_TEMP/single-best-move-verify-response.json"
          jq -n --arg query "$VERIFY_SQL" '{query:$query}' > "$payload"
          status="$(curl --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 --output "$response" --write-out '%{http_code}' \
            --request POST --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }
          echo "Single Best Move verified."

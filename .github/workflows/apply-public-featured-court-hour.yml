name: Apply Public Featured Court Hour

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-public-featured-court-hour.yml"
      - "supabase/migrations/20260826220000_public_featured_court_hour.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify public Featured Court Hour
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zcuufcpkgidmaanxjufo
      MIGRATION_FILE: supabase/migrations/20260826220000_public_featured_court_hour.sql
      MIGRATION_SHA256: ce84cc2f3f7b4e9b7aeb23dba8bbf1da5849e0de3fa6a148a9712aa08f74b78b
      PREFLIGHT_SQL: |
        with history as (
          select statements from supabase_migrations.schema_migrations
          where version = '20260826220000'
        )
        select jsonb_build_object(
          'base_ready',
            to_regclass('public.profit_learning_experiments') is not null
            and to_regclass('public.profit_learning_occurrences') is not null
            and to_regclass('public.profit_learning_occurrence_events') is not null
            and to_regprocedure('public.finalize_profit_learning_occurrence_outcomes(uuid)') is not null
            and to_regprocedure('public.demand_schedule_hour_is_unavailable(date,integer,text,jsonb,jsonb)') is not null,
          'patch_present',
            to_regclass('public.profit_learning_public_placement_events') is not null
            or to_regprocedure('public.get_public_featured_court_hour()') is not null
            or to_regprocedure('public.record_public_featured_court_event(text,text,text,text)') is not null
            or exists (
              select 1 from pg_attribute
              where attrelid = to_regclass('public.profit_learning_occurrences')
                and attname = 'public_placement_token'
                and not attisdropped
            ),
          'history_exists', exists (select 1 from history),
          'history_marker', coalesce((select statements[1] from history limit 1), '')
        ) as preflight;
      HISTORY_SQL: |
        create schema if not exists supabase_migrations;
        create table if not exists supabase_migrations.schema_migrations (
          version text not null primary key
        );
        alter table supabase_migrations.schema_migrations add column if not exists statements text[];
        alter table supabase_migrations.schema_migrations add column if not exists name text;
        insert into supabase_migrations.schema_migrations (version, name, statements)
        values (
          '20260826220000', 'public_featured_court_hour',
          array['sha256:ce84cc2f3f7b4e9b7aeb23dba8bbf1da5849e0de3fa6a148a9712aa08f74b78b']::text[]
        )
        on conflict (version) do update
        set name = excluded.name, statements = excluded.statements;
      VERIFY_SQL: |
        do $verify$
        declare
          reader regprocedure := to_regprocedure('public.get_public_featured_court_hour()');
          recorder regprocedure := to_regprocedure('public.record_public_featured_court_event(text,text,text,text)');
          finalizer regprocedure := to_regprocedure('public.finalize_profit_learning_occurrence_outcomes(uuid)');
          activation_trigger regclass := to_regclass('public.profit_learning_occurrences');
        begin
          if reader is null or recorder is null or finalizer is null then
            raise exception 'Public Featured Court Hour functions are missing';
          end if;
          if to_regclass('public.profit_learning_public_placement_events') is null then
            raise exception 'Public placement event ledger is missing';
          end if;
          if not exists (
            select 1 from pg_attribute
            where attrelid = to_regclass('public.profit_learning_occurrences')
              and attname = 'public_placement_token'
              and attnotnull
              and not attisdropped
          ) then
            raise exception 'Opaque placement token is missing or nullable';
          end if;
          if not exists (
            select 1 from pg_class
            where oid = to_regclass('public.profit_learning_public_placement_events')
              and relrowsecurity
          ) then
            raise exception 'Public placement event RLS is disabled';
          end if;
          if not exists (
            select 1 from pg_proc
            where oid = reader and prosecdef and provolatile = 's'
          ) or not exists (
            select 1 from pg_proc
            where oid = recorder and prosecdef
          ) then
            raise exception 'Public RPC execution modes are unsafe';
          end if;
          if pg_get_functiondef(reader) not ilike '%candidate.current_rate = candidate.regular_rate_snapshot%'
             or pg_get_functiondef(reader) not ilike '%demand_schedule_hour_is_unavailable%'
             or pg_get_functiondef(reader) not ilike '%placement_activated%'
             or pg_get_functiondef(recorder) not ilike '%featured-court-session|%'
             or pg_get_functiondef(recorder) not ilike '%on conflict (occurrence_id, event_type, session_hash)%'
             or pg_get_functiondef(finalizer) not ilike '%event.event_type in (''facebook_published'', ''placement_activated'')%' then
            raise exception 'Public placement or treatment-delivery contract is incomplete';
          end if;
          if not exists (
            select 1 from pg_trigger
            where tgrelid = activation_trigger
              and tgname = 'trg_activate_profit_learning_public_placement'
              and tgenabled <> 'D'
              and not tgisinternal
          ) or not exists (
            select 1 from pg_trigger
            where tgrelid = to_regclass('public.profit_learning_public_placement_events')
              and tgname = 'trg_profit_learning_public_placement_events_immutable'
              and tgenabled <> 'D'
              and not tgisinternal
          ) then
            raise exception 'Placement activation or append-only trigger is missing';
          end if;
          if exists (
            select 1
            from public.profit_learning_experiments experiment
            join public.profit_learning_occurrences occurrence
              on occurrence.experiment_id = experiment.id
             and occurrence.arm = 'treatment'
            where experiment.status = 'active'
              and experiment.target_pairs = 1
              and not exists (
                select 1 from public.profit_learning_occurrence_events event
                where event.occurrence_id = occurrence.id
                  and event.event_type = 'placement_activated'
              )
          ) then
            raise exception 'The active Best Move has no placement activation evidence';
          end if;
          if not has_function_privilege('anon', reader, 'execute')
             or not has_function_privilege('authenticated', reader, 'execute')
             or not has_function_privilege('anon', recorder, 'execute')
             or not has_function_privilege('authenticated', recorder, 'execute')
             or has_table_privilege('anon', 'public.profit_learning_public_placement_events', 'select')
             or has_table_privilege('anon', 'public.profit_learning_public_placement_events', 'insert') then
            raise exception 'Public Featured Court Hour grants are unsafe';
          end if;
          if not exists (
            select 1 from supabase_migrations.schema_migrations
            where version = '20260826220000'
              and name = 'public_featured_court_hour'
              and statements = array['sha256:ce84cc2f3f7b4e9b7aeb23dba8bbf1da5849e0de3fa6a148a9712aa08f74b78b']::text[]
          ) then
            raise exception 'Public Featured Court Hour migration history is missing';
          end if;
        end
        $verify$;
    steps:
      - uses: actions/checkout@v5

      - name: Read-only production preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          printf '%s  %s\n' "$MIGRATION_SHA256" "$MIGRATION_FILE" | sha256sum --check --strict -
          payload="$RUNNER_TEMP/public-featured-court-preflight.json"
          response="$RUNNER_TEMP/public-featured-court-preflight-response.json"
          jq -n --arg query "$PREFLIGHT_SQL" '{query:$query}' > "$payload"
          status="$(curl --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 --output "$response" --write-out '%{http_code}' \
            --request POST --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }
          result="$(jq -c 'if type=="array" then .[0].preflight elif (.result?|type)=="array" then .result[0].preflight else .preflight end' "$response")"
          [[ "$(jq -r '.base_ready' <<<"$result")" == "true" ]] || { echo "::error::Single Best Move prerequisites are missing."; exit 1; }
          if [[ "$(jq -r '.history_exists' <<<"$result")" == "true" ]]; then
            [[ "$(jq -r '.history_marker' <<<"$result")" == "sha256:$MIGRATION_SHA256" ]] || { echo "::error::Migration checksum mismatch."; exit 1; }
            echo "skip_apply=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$(jq -r '.patch_present' <<<"$result")" == "false" ]] || { echo "::error::Public Featured Court Hour exists without canonical history; refusing a partial rerun."; exit 1; }
            echo "skip_apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply checksum-locked migration exactly once
        if: steps.preflight.outputs.skip_apply != 'true'
        shell: bash
        run: |
          set -euo pipefail
          stripped="$RUNNER_TEMP/public-featured-court.sql"
          sed -e '1{/^[[:space:]]*begin;[[:space:]]*$/Id;}' \
              -e '${/^[[:space:]]*commit;[[:space:]]*$/Id;}' "$MIGRATION_FILE" > "$stripped"
          payload="$RUNNER_TEMP/public-featured-court.json"
          response="$RUNNER_TEMP/public-featured-court-response.json"
          jq -Rs --arg history "$HISTORY_SQL" \
            '{query:("begin;\n" + . + "\n" + $history + "\ncommit;")}' "$stripped" > "$payload"
          status="$(curl --silent --show-error --connect-timeout 15 --max-time 150 \
            --output "$response" --write-out '%{http_code}' --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }

      - name: Verify production database state
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/public-featured-court-verify.json"
          response="$RUNNER_TEMP/public-featured-court-verify-response.json"
          jq -n --arg query "$VERIFY_SQL" '{query:$query}' > "$payload"
          status="$(curl --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 --output "$response" --write-out '%{http_code}' \
            --request POST --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }
          echo "Public Featured Court Hour verified."

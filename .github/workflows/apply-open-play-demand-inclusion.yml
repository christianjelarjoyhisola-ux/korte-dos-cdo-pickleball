name: Apply Open Play Demand Inclusion

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/apply-open-play-demand-inclusion.yml"
      - "supabase/migrations/20260826200000_open_play_demand_inclusion.sql"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-production-deploy
  cancel-in-progress: false

jobs:
  migrate:
    name: Apply and verify Open Play demand inclusion
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_REF: zcuufcpkgidmaanxjufo
      MIGRATION_FILE: supabase/migrations/20260826200000_open_play_demand_inclusion.sql
      MIGRATION_SHA256: 08ffb89be824b226daa82a126c7e5801d63f65f2747320431e3efe4b41d9d10a
      PREFLIGHT_SQL: |
        with history as (
          select statements
          from supabase_migrations.schema_migrations
          where version = '20260826200000'
        )
        select jsonb_build_object(
          'base_ready',
            to_regprocedure('public.demand_schedule_hour_is_unavailable(date,integer,text,jsonb,jsonb)') is not null
            and to_regprocedure('public.get_profit_learning_v2_intelligence(date,date,text)') is not null,
          'patch_present',
            to_regprocedure('public.demand_schedule_hour_is_open_play(date,integer,text,jsonb,jsonb)') is not null
            or pg_get_functiondef('public.get_profit_learning_v2_intelligence(date,date,text)'::regprocedure)
              ilike '%scheduled_open_play_slots as materialized%',
          'history_exists', exists (select 1 from history),
          'history_marker', coalesce((select statements[1] from history limit 1), '')
        ) as preflight;
      HISTORY_SQL: |
        create schema if not exists supabase_migrations;
        create table if not exists supabase_migrations.schema_migrations (
          version text not null primary key
        );
        alter table supabase_migrations.schema_migrations add column if not exists statements text[];
        alter table supabase_migrations.schema_migrations add column if not exists name text;
        insert into supabase_migrations.schema_migrations (version, name, statements)
        values (
          '20260826200000',
          'open_play_demand_inclusion',
          array['sha256:08ffb89be824b226daa82a126c7e5801d63f65f2747320431e3efe4b41d9d10a']::text[]
        )
        on conflict (version) do update
        set name = excluded.name, statements = excluded.statements;
      VERIFY_SQL: |
        do $verify$
        declare
          helper regprocedure := to_regprocedure(
            'public.demand_schedule_hour_is_open_play(date,integer,text,jsonb,jsonb)'
          );
          intelligence regprocedure := to_regprocedure(
            'public.get_profit_learning_v2_intelligence(date,date,text)'
          );
        begin
          if helper is null or intelligence is null then
            raise exception 'Open Play demand functions are missing';
          end if;
          if pg_get_functiondef(helper) not ilike '%openplaysession%'
             or pg_get_functiondef(intelligence) not ilike '%scheduled_open_play_slots as materialized%'
             or pg_get_functiondef(intelligence) not ilike '%demand_schedule_hour_is_open_play%' then
            raise exception 'Open Play demand classification is incomplete';
          end if;
          if has_function_privilege('anon', helper, 'execute')
             or has_function_privilege('authenticated', helper, 'execute')
             or has_function_privilege('anon', intelligence, 'execute')
             or not has_function_privilege('authenticated', intelligence, 'execute') then
            raise exception 'Open Play demand RPC grants are unsafe';
          end if;
          if not exists (
            select 1 from supabase_migrations.schema_migrations
            where version = '20260826200000'
              and name = 'open_play_demand_inclusion'
              and statements = array[
                'sha256:08ffb89be824b226daa82a126c7e5801d63f65f2747320431e3efe4b41d9d10a'
              ]::text[]
          ) then
            raise exception 'Open Play demand migration history is missing';
          end if;
        end
        $verify$;
    steps:
      - uses: actions/checkout@v5

      - name: Read-only production preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          : "${SUPABASE_ACCESS_TOKEN:?SUPABASE_ACCESS_TOKEN secret is required}"
          printf '%s  %s\n' "$MIGRATION_SHA256" "$MIGRATION_FILE" | sha256sum --check --strict -
          payload="$RUNNER_TEMP/open-play-preflight.json"
          response="$RUNNER_TEMP/open-play-preflight-response.json"
          jq -n --arg query "$PREFLIGHT_SQL" '{query:$query}' > "$payload"
          status="$(curl --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 60 --output "$response" --write-out '%{http_code}' \
            --request POST --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }
          result="$(jq -c 'if type=="array" then .[0].preflight elif (.result?|type)=="array" then .result[0].preflight else .preflight end' "$response")"
          [[ "$(jq -r '.base_ready' <<<"$result")" == "true" ]] || { echo "::error::Open Play demand prerequisites are missing."; exit 1; }
          if [[ "$(jq -r '.history_exists' <<<"$result")" == "true" ]]; then
            [[ "$(jq -r '.history_marker' <<<"$result")" == "sha256:$MIGRATION_SHA256" ]] || { echo "::error::Migration checksum mismatch."; exit 1; }
            echo "skip_apply=true" >> "$GITHUB_OUTPUT"
          else
            [[ "$(jq -r '.patch_present' <<<"$result")" == "false" ]] || { echo "::error::Open Play demand patch exists without canonical history."; exit 1; }
            echo "skip_apply=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply checksum-locked migration exactly once
        if: steps.preflight.outputs.skip_apply != 'true'
        shell: bash
        run: |
          set -euo pipefail
          stripped="$RUNNER_TEMP/open-play-demand.sql"
          sed -e '1{/^[[:space:]]*begin;[[:space:]]*$/Id;}' \
              -e '${/^[[:space:]]*commit;[[:space:]]*$/Id;}' "$MIGRATION_FILE" > "$stripped"
          payload="$RUNNER_TEMP/open-play-demand.json"
          response="$RUNNER_TEMP/open-play-demand-response.json"
          jq -Rs --arg history "$HISTORY_SQL" \
            '{query:("begin;\n" + . + "\n" + $history + "\ncommit;")}' "$stripped" > "$payload"
          status="$(curl --silent --show-error --connect-timeout 15 --max-time 150 \
            --output "$response" --write-out '%{http_code}' --request POST \
            --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }

      - name: Verify production database state
        shell: bash
        run: |
          set -euo pipefail
          payload="$RUNNER_TEMP/open-play-verify.json"
          response="$RUNNER_TEMP/open-play-verify-response.json"
          jq -n --arg query "$VERIFY_SQL" '{query:$query}' > "$payload"
          status="$(curl --silent --show-error --retry 3 --retry-delay 3 --retry-all-errors \
            --connect-timeout 15 --max-time 120 --output "$response" --write-out '%{http_code}' \
            --request POST --url "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_REF/database/query" \
            --header "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" \
            --header "Content-Type: application/json" --data-binary "@$payload")"
          [[ "$status" =~ ^2 ]] || { jq -c '{code,message,error}' "$response" 2>/dev/null || true; exit 1; }
          echo "Open Play demand inclusion verified."

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#143d63">
  <title>Korte DOS — Offline</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: #f4f7f8; color: #143d63; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 420px; text-align: center; padding: 32px 24px; border: 1px solid #d7e0e6; border-radius: 24px; background: white; }
    img { width: 96px; height: 96px; }
    h1 { margin-bottom: 8px; font-size: 26px; }
    p { color: #657486; }
    button { border: 0; border-radius: 12px; padding: 14px 24px; background: #c83d26; color: white; font: inherit; font-weight: 700; cursor: pointer; }
    button:focus-visible { outline: 3px solid #143d63; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="/app-icon-192.png" alt="Korte DOS" width="96" height="96">
    <h1>You're offline</h1>
    <p>Connect to the internet to check current court availability and manage your booking. Reservations and payments need a live connection.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
